# rclone.conf for the dockerised SFTP/SMB NAS integration fixture.
#
# Points at the two compose services (nas-sftp / nas-smb) as a single
# logical "nas01" remote operator workflow:
#
#   1. Bring up the compose stack:
#        docker compose up -d
#
#   2. Obscure the NAS password:
#        RCLONE_PASS=$(rclone obscure 'changeme')
#
#   3. Drop it into the stanzas below (the [pass] lines), then run:
#        RCLONE_CONFIG=$PWD/tests/docker/rclone.conf rclone lsd nas01-sftp:
#        RCLONE_CONFIG=$PWD/tests/docker/rclone.conf rclone lsd nas01-smb:
#
# For the wizard's production flow the password is injected at push time
# via RCLONE_CONFIG_<REMOTE>_PASS; this file is for manual/dockerised
# integration smoke tests only.
#
# NEVER commit a real obscured password -- leave the pass lines as shown
# (commented out) so the file is safe to track in git.

[nas01-sftp]
type = sftp
host = localhost
port = 2222
user = testuser
# pass = <output of: rclone obscure 'changeme'>
# Disable host-key verification against the ephemeral container.
known_hosts_file = /dev/null
shell_type = unix

[nas01-smb]
type = smb
host = localhost
port = 1445
user = testuser
# pass = <output of: rclone obscure 'changeme'>
