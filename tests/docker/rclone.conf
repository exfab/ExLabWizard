# rclone.conf for the dockerised SFTP/SMB NAS integration fixture.
#
# Points at the two compose services (nas-sftp / nas-smb).
#
#   1. Bring up the compose stack:
#        docker compose -f tests/docker/docker-compose.yml up -d
#
#   2. Obscure the NAS password:
#        rclone obscure changeme
#
#   3. Drop the output into the pass = lines below, then run:
#        rclone --config tests/docker/rclone.conf lsd nas01-sftp:
#        rclone --config tests/docker/rclone.conf lsd nas01-smb:labshare
#
# For the wizard: set nas.remote = "nas01-sftp" and
# nas.rclone_config_path = "<absolute path to this file>" in config.yaml.
# The app uses the named remote directly; it injects no credentials.
#
# NEVER commit a real obscured password -- leave the pass lines as shown
# (commented out) so the file is safe to track in git.

[nas01-sftp]
type = sftp
host = localhost
port = 2222
user = testuser
# pass = <output of: rclone obscure 'changeme'>
# Disable host-key verification against the ephemeral container.
known_hosts_file = /dev/null
shell_type = unix

[nas01-smb]
type = smb
host = localhost
port = 1445
user = testuser
# pass = <output of: rclone obscure 'changeme'>
